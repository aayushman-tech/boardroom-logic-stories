name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate repo (stories + manifest)
        run: node tools/validate.js
      - name: Validate demo story (allow-short)
        run: node tools/validate.js --allow-short
